<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RK RAJA BOT</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: #080b12;
            color: #fff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            margin: auto;
        }

        .card {
            background: #111722;
            border: 1px solid #273044;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 15px 40px rgba(0,0,0,.35);
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 22px;
        }

        .input-box {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            color: #aeb7c9;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 1px solid #303a50;
            background: #080c14;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #667cff;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }

        button {
            flex: 1;
            border: 0;
            border-radius: 11px;
            padding: 13px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        .start {
            background: #16803c;
        }

        .stop {
            background: #b32635;
        }

        button:active {
            transform: scale(.98);
        }

        .dashboard-title {
            text-align: center;
            margin: 12px 0 15px;
            font-size: 18px;
            font-weight: 700;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat {
            background: #0b1019;
            border: 1px solid #252e41;
            border-radius: 12px;
            padding: 15px 8px;
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .stat-name {
            font-size: 12px;
            color: #9da8bb;
        }

        .online {
            color: #35dc79;
        }

        .section {
            margin-top: 22px;
        }

        .section h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .features {
            display: grid;
            gap: 9px;
        }

        .feature {
            background: #0b1019;
            border: 1px solid #252e41;
            border-radius: 10px;
            padding: 13px;
            font-size: 14px;
        }

        .logs {
            margin-top: 20px;
            background: #080c14;
            border: 1px solid #252e41;
            border-radius: 10px;
            padding: 12px;
            max-height: 180px;
            overflow-y: auto;
            font-size: 12px;
            color: #aeb7c9;
        }

        .log {
            padding: 5px 0;
            border-bottom: 1px solid #171e2b;
        }

        @media (max-width: 400px) {
            body {
                padding: 10px;
            }

            .card {
                padding: 16px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <div class="title">
            RK RAJA BOT
        </div>

        <div class="input-box">
            <label>Bot ID</label>
            <input
                id="botId"
                type="text"
                placeholder="Enter Bot ID"
            >
        </div>

        <div class="input-box">
            <label>Admin ID</label>
            <input
                id="adminId"
                type="text"
                placeholder="Enter Admin ID"
            >
        </div>

        <div class="buttons">
            <button class="start" onclick="botAction('start')">
                🟢 START
            </button>

            <button class="stop" onclick="botAction('stop')">
                🔴 STOP
            </button>
        </div>

        <div class="dashboard-title">
            📊 LIVE DASHBOARD
        </div>

        <div class="stats">

            <div class="stat">
                <span class="stat-value" id="users">0</span>
                <span class="stat-name">Users</span>
            </div>

            <div class="stat">
                <span class="stat-value" id="messages">0</span>
                <span class="stat-name">Messages</span>
            </div>

            <div class="stat">
                <span class="stat-value online" id="status">
                    ONLINE
                </span>
                <span class="stat-name">Status</span>
            </div>

        </div>

        <div class="section">
            <h3>💬 Replies / Shayari</h3>

            <div class="features">
                <div class="feature">💬 Automatic Replies</div>
                <div class="feature">❤️ Love / Baby / Jaan</div>
                <div class="feature">😂 Funny / Jokes</div>
                <div class="feature">😎 Attitude</div>
                <div class="feature">😔 Sad / Shayari</div>
                <div class="feature">🌙 Good Night</div>
                <div class="feature">👋 Bye</div>
            </div>
        </div>

        <div class="section">
            <h3>📋 Live Logs</h3>

            <div class="logs" id="logs">
                <div class="log">🤖 RK RAJA BOT dashboard loaded.</div>
            </div>
        </div>

    </div>
</div>

<script>
    async function botAction(action) {
        try {
            const response = await fetch(
                "/api/bot/" + action,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                }
            );

            const data = await response.json();

            if (data.ok) {
                addLog(
                    action === "start"
                        ? "🟢 BOT STARTED"
                        : "🔴 BOT STOPPED"
                );

                updateStatus();
            }
        } catch (error) {
            addLog("❌ Bot action failed");
        }
    }

    async function saveAdmin() {
        const adminId =
            document.getElementById("adminId").value.trim();

        if (!adminId) return;

        try {
            await fetch("/api/admin", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    admin_id: adminId
                })
            });
        } catch (error) {
            addLog("❌ Admin ID save failed");
        }
    }

    async function updateStatus() {
        try {
            const response =
                await fetch("/api/status");

            const data =
                await response.json();

            document.getElementById("users").textContent =
                data.users ?? 0;

            document.getElementById("messages").textContent =
                data.messages ?? 0;

            const status =
                document.getElementById("status");

            status.textContent =
                data.online
                    ? (data.enabled ? "ONLINE" : "STOPPED")
                    : "OFFLINE";

            status.className =
                data.online && data.enabled
                    ? "stat-value online"
                    : "stat-value";

            if (data.logs) {
                const logs =
                    document.getElementById("logs");

                logs.innerHTML =
                    data.logs.map(log =>
                        `<div class="log">
                            [${escapeHtml(log.time)}]
                            ${escapeHtml(log.message)}
                        </div>`
                    ).join("");
            }

        } catch (error) {
            document.getElementById("status")
                .textContent = "OFFLINE";
        }
    }

    function addLog(message) {
        const logs =
            document.getElementById("logs");

        const item =
            document.createElement("div");

        item.className = "log";
        item.textContent = message;

        logs.prepend(item);
    }

    function escapeHtml(value) {
        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    document
        .getElementById("adminId")
        .addEventListener("change", saveAdmin);

    updateStatus();

    setInterval(updateStatus, 3000);
</script>

</body>
</html>
